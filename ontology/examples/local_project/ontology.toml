[ontology.metadata]
extends = "episteme://10_Software_Engineering"
namespace = "local_project"
description = "Example project-local extension compiled by downstream Wendao runtime code."

[[entity]]
id = "CustomDeploymentPipeline"
base = "SoftwareComponent"
description = "Project-specific deployment pipeline tracked as a software component."

[[entity]]
id = "ReleaseApprovalRecord"
base = "DecisionRecord"
description = "Project-specific evidence record for release approval decisions."

[[relation]]
source = "CustomDeploymentPipeline"
target = "ReleaseApprovalRecord"
type = "implementsDecision"
description = "The deployment pipeline must link to the decision record that governs release approval."
