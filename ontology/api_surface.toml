[[action_types]]
domain = "episteme://30_Healthcare"
api_name = "recordEncounter"
display_name = "Record Encounter"
status = "active"
affected_object_types = ["Encounter", "Patient", "CareProvider"]
requires_evidence = true
validation_rules = [
  "30_Healthcare/rules/01_encounter_must_link_patient_provider.sql",
]
parameters = ["encounterId", "patientId", "providerId", "encounterLabel"]
operations = [
  "create_object:Encounter",
  "create_link:Patient.encounters",
]
tool_description = "Record a healthcare encounter candidate after evidence review."

[[action_types]]
domain = "episteme://20_Commercial_Finance"
api_name = "postTransaction"
display_name = "Post Transaction"
status = "active"
affected_object_types = ["Transaction", "FinancialAccount"]
requires_evidence = true
validation_rules = [
  "20_Commercial_Finance/rules/01_transaction_must_post_to_account.sql",
]
parameters = ["transactionId", "accountId", "transactionLabel"]
operations = [
  "create_object:Transaction",
  "create_link:FinancialAccount.transactions",
]
tool_description = "Post a transaction candidate after evidence review."

